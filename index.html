<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Planner</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trips"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2330;--mu:#6b7280;--ac:#0f766e;--ac2:#e6f4f2;--bd:#e5e2da;--dg:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232b;--tx:#eef0f3;--mu:#9aa3b0;--ac:#2dd4bf;--ac2:#183533;--bd:#2d333d;--dg:#f87171}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e232b;--tx:#eef0f3;--mu:#9aa3b0;--ac:#2dd4bf;--ac2:#183533;--bd:#2d333d;--dg:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 160px}
h1{font-size:24px;margin:8px 0 16px}h2{font-size:18px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mu{color:var(--mu);font-size:14px}
.emoji{font-size:32px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.d{color:var(--dg)}button.l{border:0;background:none;padding:4px 8px;color:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px #0004;border-radius:28px;padding:14px 20px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;border-radius:0;padding:8px 2px;background:none;font-size:11px}.tabs i{display:block;font-style:normal;font-size:19px}.g2>div{min-width:0}input,select{min-width:0;height:44px}input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}.sec{font-size:15px;margin:18px 2px 8px}.dh{margin:14px 2px 6px}.s{padding:6px 12px;font-size:14px}.cg+.cg{border-top:1px solid var(--bd)}.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.ck input{width:22px;height:22px;flex:none}.done{text-decoration:line-through;color:var(--mu)}.fab.t{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.tabs .on{color:var(--ac);font-weight:700}.tabs .off{opacity:.4}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.days button{white-space:nowrap;flex:none;text-align:center;line-height:1.2}
.days .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.air{font-size:26px;font-weight:700;letter-spacing:1px}
.note{background:var(--ac2);border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px}
.share{font-size:13px}
</style></head><body>
<div id="app"><p class="mu">Loading…</p></div>
<script>
(function(){
var db=null,S={trips:[],flights:[],acts:[],hotels:[],expenses:[],packing:[]},view={tripId:null,tab:'it',day:null},ready=false;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pd(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(s,o){return pd(s).toLocaleDateString(undefined,o||{day:'numeric',month:'short',year:'numeric'})}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function tripDays(t){var n=Math.max(0,daysBetween(t.start,t.end)),a=[];for(var i=0;i<=n&&i<120;i++){var d=pd(t.start);d.setDate(d.getDate()+i);a.push(iso(d))}return a}
var COLS=['trips','flights','acts','hotels','expenses','packing'],K='tp_data',store;
function loadStore(){try{store=JSON.parse(localStorage.getItem(K))}catch(e){store=null}store=store||{};COLS.forEach(function(c){store[c]=store[c]||{}});store.del=store.del||{}}
function persist(){try{localStorage.setItem(K,JSON.stringify(store))}catch(e){msg('Could not save on this device: '+e.message)}}
function load(){COLS.forEach(function(c){S[c]=Object.keys(store[c]).map(function(id){return Object.assign({},store[c][id],{id:id})})})}
function save(c,id,data){var o=Object.assign({},data);o._u=Date.now();store[c][id]=o;delete store.del[c+'/'+id];persist();load()}
function merge(inc){var n=0;inc=inc||{};COLS.forEach(function(c){var ii=inc[c]||{};Object.keys(ii).forEach(function(id){var k=c+'/'+id,t=store.del[k]||0,cur=store[c][id],u=ii[id]._u||0;if(u>t&&(!cur||u>(cur._u||0))){store[c][id]=ii[id];delete store.del[k];n++}})});
 var dd=inc.del||{};Object.keys(dd).forEach(function(k){var p=k.split('/'),cur=store[p[0]]&&store[p[0]][p[1]];if(cur&&dd[k]>(cur._u||0)){delete store[p[0]][p[1]];n++}if(!(store.del[k]>=dd[k]))store.del[k]=dd[k]});persist();load();return n}
function exportData(){var txt=JSON.stringify({app:'tripplanner',v:1,data:store}),name='trips-'+iso(new Date())+'.json',file=null;try{file=new File([txt],name,{type:'application/json'})}catch(e){}
 localStorage.setItem('tp_last',Date.now());
 if(file&&navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:'Trip Planner data'}).catch(function(){});
 else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();msg('Exported '+name)}
 render()}
function del(c,id){delete store[c][id];store.del[c+'/'+id]=Date.now();persist();load()}

function render(){try{render0()}catch(e){$('#app').innerHTML='<div class="card"><b>Something went wrong</b><p class="mu">'+esc(e&&e.message)+'</p><button id="rs">Back to trips</button></div>';$('#rs').onclick=function(){view.tripId=null;render()}}}
function render0(){
 var app=$('#app'),t=S.trips.find(function(x){return x.id===view.tripId});
 if(!t){view.tripId=null;return home(app)}
 trip(app,t);ensureWx(t)}

function home(app){
 var ts=S.trips.slice().sort(function(a,b){return a.start<b.start?-1:1}),today=iso(new Date());
 var h='<h1>✈️ My Trips</h1>';
 if(!ts.length)h+='<div class="card mu">No trips yet. Tap “+ New trip” to start planning.</div>';
 ts.forEach(function(t){
  var n=daysBetween(today,t.start),cd=today>t.end?'Completed':today>=t.start?'Happening now':n===1?'Tomorrow':n+' days to go';
  h+='<div class="card row" data-open="'+t.id+'" style="cursor:pointer"><span class="emoji">'+esc(t.emoji||'🌍')+'</span><div class="sp"><h2>'+esc(t.dest)+'</h2><div class="mu">'+fmt(t.start,{day:'numeric',month:'short'})+' – '+fmt(t.end)+'</div></div><b style="color:var(--ac)">'+cd+'</b><span class="mu">›</span></div>'});
 h+='<button class="p fab" id="newTrip">+ New trip</button>';
 var lb=+localStorage.getItem('tp_last')||0,old=ts.length&&(!lb||Date.now()-lb>7*864e5);
 h+='<div class="row" style="gap:8px;margin-top:20px;flex-wrap:wrap"><button class="s" id="exp">⬆ Export</button><button class="s" id="imp">⬇ Import</button>'+(old?'<span class="mu" style="color:var(--dg)">Backup due, tap Export</span>':'')+'</div><input type="file" id="fi" accept=".json,application/json" style="display:none">';
 app.innerHTML=h;
 app.querySelectorAll('[data-open]').forEach(function(e){e.onclick=function(){view.tripId=e.dataset.open;view.tab='it';view.day=null;render()}});
 $('#newTrip').onclick=function(){tripForm()};
 $('#exp').onclick=exportData;$('#imp').onclick=function(){$('#fi').click()};
 $('#fi').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(j.app!=='tripplanner')throw new Error('this is not a Trip Planner file');var n=merge(j.data);render();msg(n+' change'+(n===1?'':'s')+' imported')}catch(e){msg('Import failed: '+e.message)}};r.readAsText(f)}}

function trip(app,t){
 var days=tripDays(t);if(!view.day||days.indexOf(view.day)<0){var td=iso(new Date());view.day=days.indexOf(td)>=0?td:days[0]}
 var h='<div class="row"><button class="l" id="back">‹ Trips</button><span class="sp"></span><button class="l" id="edTrip">Edit</button></div>';
 h+='<div class="row" style="margin:6px 0 14px"><span class="emoji">'+esc(t.emoji||'🌍')+'</span><div><h1 style="margin:0">'+esc(t.dest)+'</h1><div class="mu">'+fmt(t.start,{day:'numeric',month:'short'})+' – '+fmt(t.end)+'</div></div></div>';
 if(view.tab==='it')h+=itin(t,days);else if(view.tab==='fl')h+=flights(t);else if(view.tab==='ho')h+=hotels(t);else if(view.tab==='bu')h+=budget(t);else if(view.tab==='pk')h+=packing(t);
 else h+='<div class="card mu">Coming in Phase 2.</div>';
 var tb=[['it','🗓','Itinerary'],['fl','🛫','Flights'],['ho','🏨','Hotels'],['bu','💰','Budget'],['pk','🎒','Packing']];
 h+='<div class="tabs">'+tb.map(function(x,i){return '<button data-tab="'+x[0]+'" class="'+(view.tab===x[0]?'on':'')+''+'"><i>'+x[1]+'</i>'+x[2]+'</button>'}).join('')+'</div>';
 app.innerHTML=h;
 $('#back').onclick=function(){view.tripId=null;render()};
 $('#edTrip').onclick=function(){tripForm(t)};
 app.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){view.tab=b.dataset.tab;render()}});
 app.querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){view.day=b.dataset.day;render()}});
 app.querySelectorAll('[data-act]').forEach(function(b){b.onclick=function(){actForm(t,S.acts.find(function(a){return a.id===b.dataset.act}))}});
 app.querySelectorAll('[data-fl]').forEach(function(b){b.onclick=function(){flForm(t,S.flights.find(function(a){return a.id===b.dataset.fl}))}});
 var a=$('#addAct');if(a)a.onclick=function(){actForm(t)};var f=$('#addFl');if(f)f.onclick=function(){flForm(t)};app.querySelectorAll('[data-cat]').forEach(function(b){b.onclick=function(){view.cat=view.cat===b.dataset.cat?'':b.dataset.cat;render()}});
 var ab=$('#addEx');if(ab)ab.onclick=function(){expForm(t)};
 app.querySelectorAll('[data-ex]').forEach(function(b){b.onclick=function(){expForm(t,S.expenses.find(function(a){return a.id===b.dataset.ex}))}});
 app.querySelectorAll('[data-wh]').forEach(function(b){b.onclick=function(){var x=view.hints[b.dataset.wh];save('packing',uid(),{trip:t.id,text:x[1],cat:x[2],done:false});hintSkip(t,x[3]);render()}});
 app.querySelectorAll('[data-wi]').forEach(function(b){b.onclick=function(){hintSkip(t,view.hints[b.dataset.wi][3]);render()}});
 var pa=$('#pkAdd');if(pa){var addP=function(){var v=$('#pkTxt').value.trim();if(!v)return;view.pc=$('#pkCat').value;save('packing',uid(),{trip:t.id,text:v,cat:view.pc,done:false});render();var n=$('#pkTxt');if(n)n.focus()};pa.onclick=addP;$('#pkTxt').onkeydown=function(e){if(e.key==='Enter')addP()}}
 app.querySelectorAll('[data-pk]').forEach(function(c){c.onchange=function(){var p=S.packing.find(function(x){return x.id===c.dataset.pk});save('packing',p.id,{trip:p.trip,text:p.text,cat:p.cat,done:c.checked});render()}});
 app.querySelectorAll('[data-pkdel]').forEach(function(b){b.onclick=function(){if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Delete?';b.style.background='var(--dg)';b.style.color='#fff';setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent='✕';b.style.background='';b.style.color=''}},4000)}else{del('packing',b.dataset.pkdel);render()}}});
 var hb=$('#addHo');if(hb)hb.onclick=function(){hoForm(t)};app.querySelectorAll('[data-ho]').forEach(function(b){b.onclick=function(){hoForm(t,S.hotels.find(function(a){return a.id===b.dataset.ho}))}})}

function itin(t,days){
 var h='<div class="days">'+days.map(function(d,i){var w=wxFor(t,d);return '<button data-day="'+d+'" class="'+(d===view.day?'on':'')+'">Day '+(i+1)+'<br><small>'+fmt(d,{day:'numeric',month:'short'})+'</small>'+(w?'<br>'+wxIcon(w.code):'')+'</button>'}).join('')+'</div>';
 var out=S.acts.filter(function(a){return a.trip===t.id&&(a.date<t.start||a.date>t.end)}).length;if(out)h+='<div class="note">⚠️ '+out+' activit'+(out>1?'ies are':'y is')+' outside your trip dates and hidden. Edit the trip dates to see '+(out>1?'them':'it')+'.</div>';
 h+='<div class="mu" style="margin-bottom:8px">'+fmt(view.day,{weekday:'long',day:'numeric',month:'long'})+'</div>';
 var as=S.acts.filter(function(a){return a.trip===t.id&&a.date===view.day}).sort(function(a,b){return (a.time||'99:99')<(b.time||'99:99')?-1:1});
 var fs=S.flights.filter(function(f){return f.trip===t.id&&((f.dep||'').slice(0,10)===view.day||(f.arr||'').slice(0,10)===view.day)});
 fs.sort(function(a,b){return (a.dep||'')<(b.dep||'')?-1:1}).forEach(function(f){var dd=(f.dep||'').slice(0,10)===view.day,ad=(f.arr||'').slice(0,10)===view.day,nx=ad?0:daysBetween(view.day,(f.arr||'').slice(0,10)),nm=((f.airline||'')+' '+(f.no||'')).trim();
  h+='<div class="note">✈️ '+(nm?esc(nm)+' · ':'')+esc(f.from)+' '+esc((f.dep||'').slice(11))+(dd?'':' ('+fmt(f.dep.slice(0,10),{day:'numeric',month:'short'})+')')+' → '+esc(f.to)+' '+esc((f.arr||'').slice(11))+(nx>0?' +'+nx:'')+'</div>'});
 S.hotels.filter(function(x){return x.trip===t.id&&view.day>=x.cin&&view.day<=x.cout}).forEach(function(x){var n=daysBetween(x.cin,x.cout),m=view.day===x.cin?'Check-in'+(x.tin?' '+esc(x.tin):''):view.day===x.cout?'Check-out'+(x.tout?' '+esc(x.tout):''):'Night '+(daysBetween(x.cin,view.day)+1)+' of '+n;h+='<div class="note">🏨 '+esc(x.name)+' · '+m+'</div>'});
 var foot='',wx=wxFor(t,view.day);
 if(wx){foot='<div class="mu" style="font-size:12px;margin-top:12px">'+(wx.k==='Typical'?'Typical = average of the same dates in past years · ':wx.k==='Sample'?'Sample = demo data, not real · ':'')+'Weather data by Open-Meteo.com'+(wx.ft?' · updated '+ago(wx.ft):'')+'</div>';h+='<div class="note">'+wxIcon(wx.code)+' '+esc(wx.n.split(',')[0])+' · '+wx.hi+'°/'+wx.lo+'°'+(wx.rain!=null?' · '+wx.rain+'% rain':'')+(wx.k!=='Forecast'?' · '+wx.k:'')+'</div>'}
 else if(!S.hotels.some(function(x){return x.trip===t.id&&x.ln}))h+='<div class="note mu">🌦 Add a hotel with a weather city (Hotels tab) to see the weather here.</div>';
 if(!as.length)h+='<div class="card mu">Nothing planned for this day yet.</div>';
 as.forEach(function(a){h+='<div class="card row" data-act="'+a.id+'" style="cursor:pointer"><b style="min-width:52px;color:var(--ac)">'+esc(a.time||'—')+'</b><div class="sp"><b>'+esc(a.title)+'</b>'+(a.loc?'<div class="mu">📍 '+esc(a.loc)+'</div>':'')+(a.notes?'<div class="mu">'+esc(a.notes)+'</div>':'')+'</div>'+'</div>'});
 return h+foot+'<button class="p fab t" id="addAct">+ Activity</button>'}

function dur(f){
 var a=new Date(f.dep),b=new Date(f.arr);if(isNaN(a)||isNaN(b))return{d:'',p:''};
 var m=(b-a)/6e4-((+f.arrTz||0)-(+f.depTz||0))*60,h=Math.floor(m/60);
 var ds=daysBetween(f.dep.slice(0,10),f.arr.slice(0,10));
 return{d:m>0?h+'h '+Math.round(m%60)+'m':'',p:ds>0?'+'+ds+' day':''}}

function flights(t){
 var fs=S.flights.filter(function(f){return f.trip===t.id}).sort(function(a,b){return (a.dep||'')<(b.dep||'')?-1:1}),h='';
 if(!fs.length)h+='<div class="card mu">No flights yet. Add outbound, return and any connections.</div>';
 fs.forEach(function(f){var d=dur(f);
  h+='<div class="card" data-fl="'+f.id+'" style="cursor:pointer"><div class="row mu"><b>'+esc(f.airline)+' '+esc(f.no)+'</b><span class="sp"></span>'+(f.ref?'Ref '+esc(f.ref):'')+(f.seat?' · Seat '+esc(f.seat):'')+'</div>'+
  '<div class="row" style="margin:8px 0"><div><div class="air">'+esc(f.from)+'</div><div>'+esc((f.dep||'').slice(11))+'</div><div class="mu">'+(f.dep?fmt(f.dep.slice(0,10),{day:'numeric',month:'short'}):'')+'</div></div><div class="sp" style="text-align:center" ><div class="mu">'+d.d+'</div>✈️</div><div style="text-align:right"><div class="air">'+esc(f.to)+'</div><div>'+esc((f.arr||'').slice(11))+' <b style="color:var(--ac)">'+d.p+'</b></div><div class="mu">'+(f.arr?fmt(f.arr.slice(0,10),{day:'numeric',month:'short'}):'')+'</div></div></div>'+(f.notes?'<div class="mu">'+esc(f.notes)+'</div>':'')+'</div>'});
 return h+'<div class="mu share">Times are local to each airport.</div><button class="p fab t" id="addFl">+ Flight</button>'}

function hotels(t){
 var hs=S.hotels.filter(function(z){return z.trip===t.id}).sort(function(a,b){return a.cin<b.cin?-1:1}),h='';
 if(!hs.length)h+='<div class="card mu">No hotels yet. Add each stay once with its check-in and check-out dates. It shows on every day of the stay automatically.</div>';
 hs.forEach(function(x){var n=daysBetween(x.cin,x.cout);
  h+='<div class="card" data-ho="'+x.id+'" style="cursor:pointer"><div class="row"><h2 class="sp">🏨 '+esc(x.name)+'</h2><b style="color:var(--ac)">'+n+' night'+(n>1?'s':'')+'</b></div><div class="mu">'+(x.addr?'📍 '+esc(x.addr)+'<br>':'')+(x.ln?'🌦 Weather: '+esc(x.ln)+'<br>':'')+'Check-in '+fmt(x.cin,{day:'numeric',month:'short'})+(x.tin?' · '+esc(x.tin):'')+'<br>Check-out '+fmt(x.cout,{day:'numeric',month:'short'})+(x.tout?' · '+esc(x.tout):'')+(x.ref?'<br>Ref '+esc(x.ref):'')+'</div>'+(x.notes?'<div class="mu">'+esc(x.notes)+'</div>':'')+'</div>'});
 return h+'<button class="p fab t" id="addHo">+ Hotel</button>'}
var CATS=[['food','🍜','Food'],['transport','🚆','Transport'],['hotel','🏨','Hotel'],['shopping','🛍','Shopping'],['activities','🎟','Activities'],['other','📌','Other']],PC=['Clothes','Toiletries','Documents','Electronics','Other'];
function fm(n){return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function cat(k){return CATS.find(function(c){return c[0]===k})||CATS[5]}
function budget(t){
 var hc=t.cur||'SGD',es=S.expenses.filter(function(e){return e.trip===t.id}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0}),tot=0,bc={},bd=+t.budget||0,h='';
 es.forEach(function(e){tot+=+e.home||0;bc[e.cat]=(bc[e.cat]||0)+(+e.home||0)});

  save('acts',a.id||uid(),{trip:t.id,date:v.date,time:gt(v,'time'),title:v.title,loc:v.loc,notes:v.notes});view.day=v.date},
 a.id&&function(){del('acts',a.id)})}

function flForm(t,x){
 x=x||{};
 modal('<h2>'+(x.id?'Edit flight':'New flight')+'</h2><div class="g2"><div>'+f('airline','Airline',x.airline)+'</div><div>'+f('no','Flight no.',x.no)+'</div><div>'+f('from','From (airport code)',x.from,'text','maxlength="4" placeholder="SIN"')+'</div><div>'+f('to','To (airport code)',x.to,'text','maxlength="4" placeholder="NRT"')+'</div></div>'+
 f('dep_d','Departure date (local)',(x.dep||t.start+'T09:00').slice(0,10),'date')+tm('dep','Departure time (local)',(x.dep||t.start+'T09:00').slice(11))+f('depTz','Departure time zone (UTC offset, e.g. 8)',x.depTz||'8','number','step="0.5"')+
 f('arr_d','Arrival date (local)',(x.arr||t.start+'T17:00').slice(0,10),'date')+tm('arr','Arrival time (local)',(x.arr||t.start+'T17:00').slice(11))+f('arrTz','Arrival time zone (UTC offset, e.g. 9)',x.arrTz||'9','number','step="0.5"')+
 '<div class="g2"><div>'+f('ref','Booking reference',x.ref)+'</div><div>'+f('seat','Seat',x.seat)+'</div></div><label>Notes</label><textarea name="notes" rows="2">'+esc(x.notes)+'</textarea>',
 function(v){['dep','arr'].forEach(function(k){v[k]=v[k+'_d']+'T'+gt(v,k);delete v[k+'_d']});if(!v.from||!v.to||v.dep.length<16||v.arr.length<16){msg('Please fill airports, departure and arrival.');return false}
  v.from=v.from.toUpperCase();v.to=v.to.toUpperCase();v.trip=t.id;save('flights',x.id||uid(),v)},
 x.id&&function(){del('flights',x.id)})}

document.addEventListener('click',function(e){var o=e.target.closest&&e.target.closest('[data-open],[data-tab],[data-day]');if(!o||$('.modal'))return;if(o.dataset.open){view.tripId=o.dataset.open;view.tab='it';view.day=null}else if(o.dataset.tab)view.tab=o.dataset.tab;else view.day=o.dataset.day;render()});
window.addEventListener('error',function(e){var b=document.createElement('div');b.className='card';b.style.cssText='position:fixed;top:8px;left:8px;right:8px;z-index:99';b.textContent='Error: '+e.message;document.body.appendChild(b)});
loadStore();load();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
